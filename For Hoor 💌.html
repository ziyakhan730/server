<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Hoor 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ec;--bg2:#ff9fb8;--ink:#5a1230;--accent:#e0245e;--paper:#fff8f1;--env:#f4b6c8;--env2:#e993ac;--glow:#ff4d88}
*{box-sizing:border-box;margin:0}
.scenery{position:fixed;inset:0;z-index:0}
.scenery svg{width:100%;height:100%;display:block}
.cl{animation:drift 18s ease-in-out infinite alternate}
.cl2{animation-duration:26s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(90px)}}
.msg{text-shadow:0 0 12px rgba(255,255,255,.8)}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);font-family:'Great Vibes',cursive,serif;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.bg-heart{position:fixed;bottom:-40px;pointer-events:none;color:var(--accent);opacity:.5;animation:rise linear forwards;z-index:0}
@keyframes rise{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:1;transition:opacity .9s}
.scene.hide{opacity:0;pointer-events:none}
.scene.off{display:none}
/* envelope */
.hint{font-size:2rem;margin-top:36px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
.env{position:relative;width:min(320px,80vw);aspect-ratio:3/2;cursor:pointer;filter:drop-shadow(0 20px 30px rgba(90,18,48,.35));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.env.open{animation:none}
.back{position:absolute;inset:0;background:var(--env2);border-radius:8px}
.card{position:absolute;left:8%;right:8%;top:6%;height:88%;background:var(--paper);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--accent);transition:transform 1.1s .7s cubic-bezier(.3,1.2,.5,1);z-index:2}
.env.open .card{transform:translateY(-75%) scale(1.05)}
.front{position:absolute;inset:0;z-index:3;background:var(--env);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:8px}
.flap{position:absolute;left:0;right:0;top:0;height:55%;background:var(--env);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s,z-index 0s .4s;z-index:4;filter:brightness(1.08)}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:2.6rem;z-index:5;transition:opacity .4s;animation:beat 1.2s infinite}
.env.open .seal{opacity:0}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.2)}}
/* name */
.name{display:flex;gap:1vw;font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(4.5rem,24vw,15rem);line-height:1;color:var(--accent);text-shadow:0 0 40px var(--glow),0 8px 0 rgba(0,0,0,.12)}
.ltr{display:inline-block;opacity:0;transform:translateY(-120vh) rotate(-25deg)}
.ltr.drop{animation:drop 1.3s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes drop{0%{opacity:1;transform:translateY(-120vh) rotate(-25deg)}100%{opacity:1;transform:none}}
.fade{opacity:0;transform:translateY(16px);transition:opacity 1s,transform 1s}
.fade.show{opacity:1;transform:none}
.love{font-size:clamp(2.4rem,9vw,4.5rem);margin-top:10px}
.msg{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(1rem,3.8vw,1.35rem);max-width:30ch;margin:14px auto 22px;line-height:1.5}
.btns{display:flex;gap:18px;justify-content:center;align-items:center;min-height:64px}
button{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.15rem;border:0;border-radius:999px;padding:14px 38px;cursor:pointer}
#yes{background:var(--accent);color:#fff;box-shadow:0 8px 24px var(--glow);transition:transform .25s;animation:beat2 1.3s infinite}
@keyframes beat2{50%{transform:scale(1.07)}}
#no{background:#fff;color:#5a1230;box-shadow:0 6px 18px rgba(90,18,48,.25);transition:left .25s,top .25s}
.big{font-size:clamp(3.2rem,15vw,8rem);color:var(--accent);text-shadow:0 0 30px var(--glow)}
.call{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(1.2rem,5vw,1.8rem);margin-top:16px}
.pop{position:fixed;pointer-events:none;z-index:0;animation:pop 2.2s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) rotate(360deg) scale(.4);opacity:0}}
</style>
</head>
<body>
<div class="scenery" aria-hidden="true"><svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4f2"/><stop offset=".55" stop-color="#bfe3f7"/><stop offset="1" stop-color="#ffdbe6"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fff6c9" stop-opacity=".95"/><stop offset="1" stop-color="#fff6c9" stop-opacity="0"/></radialGradient>
<symbol id="c" viewBox="0 0 200 100"><g fill="#fff"><ellipse cx="100" cy="72" rx="92" ry="24"/><circle cx="62" cy="54" r="30"/><circle cx="106" cy="40" r="38"/><circle cx="148" cy="57" r="26"/></g></symbol>
</defs>
<rect width="800" height="600" fill="url(#sky)"/>
<circle cx="620" cy="150" r="190" fill="url(#sun)"/>
<use class="cl" href="#c" x="40" y="70" width="300" height="150" opacity=".95"/>
<use class="cl cl2" href="#c" x="420" y="40" width="360" height="180"/>
<use class="cl2" href="#c" x="200" y="230" width="220" height="110" opacity=".8"/>
<path d="M0 430 Q150 340 320 410 T640 380 T800 420 V600 H0Z" fill="#a8d8a0"/>
<path d="M0 480 Q200 400 400 470 T800 450 V600 H0Z" fill="#7fc48a"/>
<path d="M0 540 Q220 480 450 530 T800 510 V600 H0Z" fill="#5aae6f"/>
<g><circle cx="90" cy="560" r="7" fill="#ff8fb0"/><circle cx="150" cy="575" r="6" fill="#fff"/><circle cx="230" cy="552" r="7" fill="#ffe27a"/><circle cx="330" cy="566" r="6" fill="#ff8fb0"/><circle cx="470" cy="560" r="7" fill="#fff"/><circle cx="560" cy="578" r="6" fill="#ffe27a"/><circle cx="660" cy="548" r="7" fill="#ff8fb0"/><circle cx="730" cy="570" r="6" fill="#fff"/></g>
</svg></div>

<div class="scene" id="s1">
  <div class="env" id="env">
    <div class="back"></div>
    <div class="card">For Hoor ♥</div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">❤️</div>
  </div>
  <div class="hint" id="hint">Tap to open, Hoor 💌</div>
</div>

<div class="scene off hide" id="s2">
  <div class="name" id="name"></div>
  <div class="love fade" id="love">I love you so much ❤️</div>
  <p class="msg fade" id="msg">I know that you love me too… but I want to hear you say it. 🥹</p>
  <div class="btns fade" id="btns">
    <button id="yes">Yes 💖</button>
    <button id="no">No</button>
  </div>
</div>

<div class="scene off hide" id="s3">
  <div class="big">I knew it 💖</div>
  <div class="call">Now call me or text me 📞💬</div>
</div>

<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// floating background hearts
setInterval(()=>{
  const h=document.createElement('div');
  h.className='bg-heart';h.textContent=['♥','💗','💕'][Math.random()*3|0];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(14+Math.random()*28)+'px';
  h.style.animationDuration=(6+Math.random()*6)+'s';
  document.body.appendChild(h);setTimeout(()=>h.remove(),12000);
},600);

function burst(n,emojis){
  for(let i=0;i<n;i++){
    const p=document.createElement('div');p.className='pop';
    p.textContent=emojis[Math.random()*emojis.length|0];
    p.style.left='50vw';p.style.top='50vh';
    p.style.fontSize=(18+Math.random()*30)+'px';
    p.style.setProperty('--x',(Math.random()*120-60)+'vw');
    p.style.setProperty('--y',(Math.random()*120-60)+'vh');
    document.body.appendChild(p);setTimeout(()=>p.remove(),2300);
  }
}

function swap(from,to){
  $(from).classList.add('hide');
  return sleep(900).then(()=>{
    $(from).classList.add('off');
    $(to).classList.remove('off');
    return sleep(50);
  }).then(()=>$(to).classList.remove('hide'));
}

let opened=false;
$('env').addEventListener('click',async()=>{
  if(opened)return;opened=true;
  $('env').classList.add('open');$('hint').style.opacity=0;
  burst(24,['💖','✨','💕']);
  await sleep(2400);
  await swap('s1','s2');
  const box=$('name');
  [...'HOOR'].forEach(c=>{const s=document.createElement('span');s.className='ltr';s.textContent=c;box.appendChild(s)});
  for(const l of box.children){await sleep(900);l.classList.add('drop')}
  await sleep(1900);
  $('love').classList.add('show');
  await sleep(1500);
  $('msg').classList.add('show');
  await sleep(1500);
  $('btns').classList.add('show');
});

// the runaway No button
const no=$('no'),yes=$('yes');let tries=0;
const lines=['No','Are you sure? 🥺','Try again 😏','Nope!','Too slow 😜','Just say yes 💕'];
function dodge(e){
  if(e){e.preventDefault();e.stopPropagation()}
  tries++;
  no.style.position='fixed';
  no.textContent=lines[tries%lines.length];
  const w=innerWidth-no.offsetWidth-24,h=innerHeight-no.offsetHeight-24;
  const avoid=[$('name'),$('love'),$('msg'),yes].map(el=>el.getBoundingClientRect());
  const bw=no.offsetWidth,bh=no.offsetHeight;let L,T;
  for(let i=0;i<60;i++){
    L=12+Math.random()*w;T=12+Math.random()*h;
    const hit=avoid.some(r=>L<r.right+12&&L+bw>r.left-12&&T<r.bottom+12&&T+bh>r.top-12);
    if(!hit)break;
  }
  no.style.left=L+'px';
  no.style.top=T+'px';
  yes.style.fontSize=Math.min(1.15+tries*0.08,2)+'rem';
}
['pointerenter','pointerdown','touchstart','click','mouseover'].forEach(ev=>no.addEventListener(ev,dodge,{passive:false}));

yes.addEventListener('click',async()=>{
  no.style.display='none';
  burst(60,['💖','💕','❤️','✨','🌹','💗']);
  await sleep(700);
  await swap('s2','s3');
  burst(80,['💖','💕','❤️','✨','🌹','💗']);
  setInterval(()=>burst(10,['💖','💗','🌹']),1800);
});
</script>
</body>
</html>
