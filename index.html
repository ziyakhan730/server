<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zizu &amp; Hoor, Our Story</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pg1:#ffe3ec;--pg2:#ffc2d4;--card:rgba(255,255,255,.88);--ink:#4a1230;--accent:#e0245e;--c1:#fff;--c2:#ffd0e0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg1:#2a0715;--pg2:#4a1230;--card:rgba(30,10,25,.85);--ink:#ffe3ec;--accent:#ff6fa0;--c1:#3b2540;--c2:#7a2347}}
:root[data-theme="dark"]{--pg1:#2a0715;--pg2:#4a1230;--card:rgba(30,10,25,.85);--ink:#ffe3ec;--accent:#ff6fa0;--c1:#3b2540;--c2:#7a2347}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Playfair Display',Georgia,serif;color:var(--ink);overflow:hidden;background:linear-gradient(var(--pg1),var(--pg2))}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 14px 16px;text-align:center}
.bar{width:min(560px,100%);height:6px;border-radius:9px;background:rgba(255,255,255,.5);overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .7s}
.stage{flex:1;min-height:0;width:100%;max-width:720px;position:relative;overflow:hidden;border-radius:24px;box-shadow:0 12px 34px rgba(90,18,48,.25);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 3% 5%;transition:background .8s}
.stage.in{animation:fadeIn .8s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{flex:none;width:min(560px,100%);background:var(--card);backdrop-filter:blur(8px);border-radius:22px;padding:12px 18px 14px;box-shadow:0 10px 30px rgba(90,18,48,.2)}
.card h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(1.9rem,7.5vw,2.8rem);color:var(--accent)}
.card p{font-size:clamp(.9rem,3.6vw,1.1rem);line-height:1.5;margin-top:2px}
.btns{display:flex;gap:12px;margin-top:10px;justify-content:center}
button{font-family:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:999px;padding:11px 34px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(224,36,94,.4)}
button.ghost{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--accent);padding:9px 20px}
button:disabled{opacity:.35;cursor:default}
#next{animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.06)}}
.row{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;gap:clamp(4px,3vw,28px);width:100%}
.who{display:flex;flex-direction:column;align-items:center}
.nm{font-family:'Great Vibes',cursive;font-size:clamp(1.3rem,5.5vw,2rem);color:#000;background:rgba(255,255,255,.7);border-radius:12px;padding:0 10px;margin-top:2px}
.tag{font-size:.7rem;background:var(--accent);color:#fff;border-radius:9px;padding:1px 8px;margin-top:3px}
.ch{width:clamp(60px,19vw,125px);height:auto;overflow:visible}
.ch.sm{width:clamp(44px,13vw,88px)}.ch.kid{width:clamp(34px,10vw,64px)}
.baby{width:clamp(54px,16vw,100px)}
.hh{width:22px;height:20px;display:block}
.ph{width:clamp(26px,8vw,42px);height:auto;align-self:center}
.bob .body{animation:bob 1.2s ease-in-out infinite}.d2 .body{animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-6px)}}
.eyes{animation:blink 4s infinite;transform-origin:50px 50px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wave{transform-origin:77px 82px;animation:wv .6s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(0)}to{transform:rotate(-60deg)}}
.wl{animation:wl 2.6s ease-out both}.wr{animation:wr 2.6s ease-out both}
@keyframes wl{from{transform:translateX(-60vw)}to{transform:none}}
@keyframes wr{from{transform:translateX(60vw)}to{transform:none}}
.pop{animation:pop .8s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
.fu{animation:fu .9s both;animation-delay:var(--d,0s)}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.cl{position:absolute;left:-40%;animation:cld linear infinite;opacity:.9}
@keyframes cld{to{left:110%}}
.gr{position:absolute;bottom:0;left:0;width:100%;height:32%}
.st{position:absolute;width:12px;animation:tw 2s infinite alternate}
@keyframes tw{from{opacity:.15;transform:scale(.6)}to{opacity:1;transform:scale(1.1)}}
.gap{flex:1;position:relative;height:70px;display:flex;align-items:center;align-self:center}
.dash{width:100%;border-top:3px dashed rgba(60,40,90,.45)}
.q{position:absolute;left:46%;font-size:1.8rem;color:var(--accent);animation:fl 2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px)}}
.trv{position:absolute;animation:trv 2.6s linear infinite both}
@keyframes trv{0%{left:0;top:50%;opacity:0}10%{opacity:1}50%{top:10%}90%{opacity:1}100%{left:88%;top:50%;opacity:0}}
.ring{position:absolute;width:40px;height:40px;border:3px solid #ff4d88;border-radius:50%;animation:rg 1.8s infinite;opacity:0}
@keyframes rg{from{transform:scale(.4);opacity:.9}to{transform:scale(2.2);opacity:0}}
.chat{position:relative;z-index:2;display:flex;flex-direction:column;width:min(400px,92%);margin-bottom:6px}
.bub{max-width:80%;padding:7px 14px;border-radius:16px;font-size:clamp(.85rem,3.6vw,1.05rem);margin:3px 0;box-shadow:0 4px 12px rgba(0,0,0,.12);color:var(--ink)}
.bub.l{align-self:flex-start;background:var(--c1);border-bottom-left-radius:4px}
.bub.r{align-self:flex-end;background:var(--c2);border-bottom-right-radius:4px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--accent);animation:dt 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{50%{transform:translateY(-5px)}}
.tb{background:#fff;border-radius:50%;padding:7px;margin-bottom:6px;animation:fl 2.2s ease-in-out infinite;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.moon{position:absolute;top:6%;right:10%;width:clamp(60px,18vw,110px);filter:drop-shadow(0 0 18px #fff6c9);animation:fl 5s infinite}
.shoot{position:absolute;top:10%;left:60%;width:80px;height:2px;background:linear-gradient(90deg,#fff,transparent);transform:rotate(-30deg);animation:sh 4s infinite;opacity:0}
@keyframes sh{0%{transform:translate(0,0) rotate(-30deg);opacity:0}5%{opacity:1}20%{transform:translate(-220px,130px) rotate(-30deg);opacity:0}100%{opacity:0}}
.bh,.fw i{position:absolute;animation:bst 1.8s infinite;animation-delay:var(--d,0s)}
.bh{left:50%;bottom:34%}
.fw{position:absolute;width:0;height:0}.fw i{width:7px;height:7px;border-radius:50%}
@keyframes bst{from{transform:rotate(var(--a)) translateY(0) scale(.3);opacity:1}to{transform:rotate(var(--a)) translateY(-85px) scale(1);opacity:0}}
.sun{position:absolute;left:50%;top:14%;width:clamp(90px,26vw,160px);height:clamp(90px,26vw,160px);margin-left:calc(clamp(90px,26vw,160px)/-2);border-radius:50%;background:radial-gradient(#fff3b0,#ffb36b);animation:fl 4s infinite}
.bld{position:absolute;bottom:20%;width:30%}
.arch{position:absolute;bottom:4%;left:50%;width:min(94%,420px);transform:translateX(-50%)}
.rings{position:absolute;top:10%;left:50%;width:70px;margin-left:-35px;animation:fl 3s infinite}
.plane{position:absolute;top:8%;width:clamp(70px,20vw,120px);animation:fly 6s linear infinite}
@keyframes fly{from{left:-25%}to{left:105%}}
.lm{width:clamp(44px,14vw,86px);height:auto}
.heartbig{width:clamp(120px,46vw,230px);animation:hb 1.2s infinite;filter:drop-shadow(0 0 24px #ff4d88)}
@keyframes hb{20%{transform:scale(1.14)}40%{transform:scale(.98)}60%{transform:scale(1.1)}}
.names{font-family:'Great Vibes',cursive;font-size:clamp(2.4rem,11vw,4.4rem);color:#000;text-shadow:0 0 10px #fff,0 0 22px #fff,0 0 34px rgba(255,255,255,.9)}
.gift{width:clamp(36px,11vw,64px);align-self:center}
.rise{position:absolute;bottom:-30px;animation:ri linear infinite}
@keyframes ri{to{transform:translateY(-70vh) rotate(25deg);opacity:0}}
.rainy{position:fixed;top:-40px;pointer-events:none;z-index:0;animation:rain linear forwards}
@keyframes rain{to{transform:translateY(115vh) rotate(260deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="hrt" viewBox="0 0 32 29"><path d="M16 28C-8 12 4-4 16 7 28-4 40 12 16 28Z"/></symbol></svg>
<div id="app">
  <div class="bar"><i id="prog"></i></div>
  <div class="stage" id="stage"></div>
  <div class="card">
    <h2 id="title"></h2>
    <p id="text"></p>
    <div class="btns"><button class="ghost" id="back">Back</button><button id="next">Next</button></div>
  </div>
</div>
<script>
const B='Zizu',G='Hoor';
const H=(c='#ff4d88',cl='')=>`<svg class="hh ${cl}" viewBox="0 0 32 29"><use href="#hrt" fill="${c}"/></svg>`;
function ch(o={}){
 const sk=o.sk||(o.girl?'#f3cfae':'#e8b48a'),hr=o.hr||(o.girl?'#1d1210':'#2b1a14'),tp=o.tp||(o.girl?'#ff6fa0':'#4a90e2'),bt=o.bt||'#2f3b63';
 let s=`<svg class="ch ${o.c||''}" viewBox="0 0 100 170"><g class="body">`;
 if(o.girl)s+=`<path d="M20 58Q18 20 50 18Q82 20 80 58L84 122Q50 134 16 122Z" fill="${hr}"/>`;
 if(o.girl||o.bride)s+=`<rect x="38" y="140" width="9" height="24" fill="${sk}"/><rect x="53" y="140" width="9" height="24" fill="${sk}"/><path d="M30 78H70L90 150H10Z" fill="${tp}"/>`;
 else s+=`<rect x="34" y="112" width="14" height="50" rx="6" fill="${bt}"/><rect x="52" y="112" width="14" height="50" rx="6" fill="${bt}"/><rect x="30" y="160" width="20" height="8" rx="4" fill="#222"/><rect x="50" y="160" width="20" height="8" rx="4" fill="#222"/><rect x="28" y="76" width="44" height="46" rx="14" fill="${tp}"/>`;
 s+=`<rect x="16" y="80" width="13" height="40" rx="6.5" fill="${tp}"/><circle cx="22" cy="122" r="7" fill="${sk}"/><g class="${o.wave?'wave':''}"><rect x="71" y="80" width="13" height="40" rx="6.5" fill="${tp}"/><circle cx="78" cy="122" r="7" fill="${sk}"/></g>`;
 s+=`<circle cx="50" cy="48" r="26" fill="${sk}"/><path d="M23 48Q22 16 50 17Q78 16 77 48Q66 30 50 33Q34 30 23 48Z" fill="${hr}"/><g class="eyes"><circle cx="40" cy="50" r="3" fill="#2b1a14"/><circle cx="60" cy="50" r="3" fill="#2b1a14"/></g><path d="M42 60Q50 68 58 60" stroke="#8a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="34" cy="58" r="4" fill="#ff8fb0" opacity=".5"/><circle cx="66" cy="58" r="4" fill="#ff8fb0" opacity=".5"/>`;
 if(o.bride)s+=`<path d="M22 30Q50 2 78 30L90 150H10Z" fill="#fff" opacity=".4"/>`;
 if(o.groom)s+=`<path d="M42 80l8 6 8-6v10l-8-6-8 6z" fill="#e0245e"/>`;
 return s+'</g></svg>';
}
const baby=()=>`<svg class="ch baby bob" viewBox="0 0 100 120"><g class="body"><rect x="26" y="70" width="48" height="44" rx="20" fill="#ffd6e7"/><circle cx="50" cy="44" r="30" fill="#f3cfae"/><path d="M30 30Q50 8 70 30Q50 22 30 30Z" fill="#2b1a14"/><g class="eyes"><circle cx="40" cy="46" r="3.2" fill="#2b1a14"/><circle cx="60" cy="46" r="3.2" fill="#2b1a14"/></g><path d="M44 56Q50 62 56 56" stroke="#8a3a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="34" cy="54" r="5" fill="#ff8fb0" opacity=".5"/><circle cx="66" cy="54" r="5" fill="#ff8fb0" opacity=".5"/></g></svg>`;
const phone=()=>`<svg class="ph" viewBox="0 0 60 110"><rect x="3" y="3" width="54" height="104" rx="12" fill="#222"/><rect x="9" y="14" width="42" height="82" rx="6" fill="#ffd6e7"/><use class="beat" href="#hrt" x="19" y="45" width="22" height="20" fill="#ff4d88"/></svg>`;
const W=(svg,n,top='',tag='')=>`<div class="who">${top}${svg}<div class="nm">${n}</div>${tag?`<div class="tag">${tag}</div>`:''}</div>`;
const CL=(t,d,w,dl=0)=>`<svg class="cl" style="top:${t}%;animation-duration:${d}s;animation-delay:-${dl}s;width:${w}px" viewBox="0 0 200 100"><g fill="#fff"><ellipse cx="100" cy="72" rx="92" ry="24"/><circle cx="62" cy="54" r="30"/><circle cx="106" cy="40" r="38"/><circle cx="148" cy="57" r="26"/></g></svg>`;
const GR=c=>`<svg class="gr" viewBox="0 0 800 120" preserveAspectRatio="none"><path d="M0 50Q200 0 400 40T800 30V120H0Z" fill="${c}"/></svg>`;
const stars=(n,c='#fff')=>Array.from({length:n},(_,k)=>`<svg class="st" style="left:${(k*37+11)%92}%;top:${(k*23+5)%45}%;animation-delay:${(k%5)*.4}s" viewBox="0 0 20 20"><path d="M10 0L12 8L20 10L12 12L10 20L8 12L0 10L8 8Z" fill="${c}"/></svg>`).join('');
const city=(l,c)=>`<svg class="bld" style="${l}" viewBox="0 0 100 80"><rect x="4" y="34" width="24" height="46" fill="${c}"/><rect x="32" y="12" width="26" height="68" fill="${c}"/><rect x="62" y="40" width="30" height="40" fill="${c}"/><g fill="#fff6c9"><rect x="9" y="42" width="5" height="6"/><rect x="38" y="22" width="5" height="6"/><rect x="48" y="40" width="5" height="6"/><rect x="70" y="50" width="5" height="6"/></g></svg>`;
const burst=(d)=>Array.from({length:8},(_,k)=>`<span class="bh" style="--a:${k*45}deg;--d:${d}s">${H()}</span>`).join('');
const fw=(x,y,d,c)=>`<div class="fw" style="left:${x}%;top:${y}%">${Array.from({length:12},(_,k)=>`<i style="--a:${k*30}deg;background:${c};--d:${d}s"></i>`).join('')}</div>`;
const lm={
 eiffel:`<svg class="lm pop" viewBox="0 0 60 100"><path d="M30 4L46 96H14Z" fill="#6b5b7b"/><path d="M22 62H38M26 38H34M30 4V96" stroke="#fff" stroke-width="2"/></svg>`,
 taj:`<svg class="lm pop" style="--d:.4s" viewBox="0 0 80 100"><g fill="#fff3ea" stroke="#d9b8a8"><rect x="14" y="52" width="52" height="40"/><path d="M20 52Q40 8 60 52Z"/><rect x="3" y="40" width="9" height="52"/><rect x="68" y="40" width="9" height="52"/></g><path d="M36 92V72Q40 64 44 72V92Z" fill="#c8a898"/></svg>`,
 pyr:`<svg class="lm pop" style="--d:.8s" viewBox="0 0 90 70"><path d="M45 4L88 66H2Z" fill="#e8b84a"/><path d="M45 4L88 66H45Z" fill="#d49a2a"/></svg>`,
 mtn:`<svg class="lm pop" style="--d:1.2s" viewBox="0 0 80 100"><path d="M5 96L40 12L75 96Z" fill="#7a8fb5"/><path d="M40 12L52 40L40 34L28 42Z" fill="#fff"/></svg>`};
const S=[
{bg:'linear-gradient(#cfd8e8,#e8d9ea)',t:'Two Worlds',p:`Once upon a time, ${B} and ${G} lived in two different cities. It had been many, many years since they last met, and they had no way to reach each other.`,
 h:()=>CL(8,24,120)+CL(30,34,90,12)+GR('#9bc79a')+city('left:3%','#8a93b8')+city('right:3%','#b48aa8')+`<div class="row">${W(ch({c:'bob'}),B)}<div class="gap"><i class="dash"></i><b class="q">?</b></div>${W(ch({girl:1,c:'bob d2'}),G)}</div>`},
{bg:'linear-gradient(#ffd6e7,#ffe9c9)',t:'A Phone Call Away',p:`Then a little phone connected two faraway hearts. Everything changed with a single "hello".`,
 h:()=>CL(10,26,110)+GR('#a8d8a0')+`<div class="row">${W(ch({c:'bob'}),B)}${phone()}<div class="gap"><span class="trv">${H()}</span><span class="trv" style="animation-delay:.9s">${H('#ff9a3c')}</span><span class="trv" style="animation-delay:1.8s;animation-direction:reverse">${H('#7a5cff')}</span></div>${phone()}${W(ch({girl:1,c:'bob d2'}),G)}</div><div class="ring" style="left:36%;bottom:34%"></div><div class="ring" style="right:36%;bottom:34%;animation-delay:.9s"></div>`},
{bg:'linear-gradient(#d6e8ff,#ffe0ef)',t:'Chats, Chats & More Chats',p:`From their own colleges, they talked about everything: classes, dreams, silly jokes and how the day went.`,
 h:()=>CL(6,28,100)+`<div class="chat"><div class="bub l fu">Good morning! Did you eat?</div><div class="bub r fu" style="--d:.9s">Yes! Now go to class :)</div><div class="bub l fu" style="--d:1.8s">You made my whole day</div><div class="bub r fu" style="--d:2.7s">You make mine too</div><div class="bub l fu dots" style="--d:3.6s"><i></i><i></i><i></i></div></div><div class="row">${W(ch({c:'sm bob'}),B,'','His college')}<div class="gap"><span class="trv">${H()}</span></div>${W(ch({girl:1,c:'sm bob d2'}),G,'','Her college')}</div>`},
{bg:'linear-gradient(#1b1f4a,#4a2c6b)',t:'Missing You',p:`The nights were long. Under the same moon they looked at the sky and missed each other more than words could say.`,
 h:()=>stars(14)+`<div class="shoot"></div><svg class="moon" viewBox="0 0 100 100"><path d="M60 10A40 40 0 1 0 60 90A32 32 0 1 1 60 10Z" fill="#fff6c9"/></svg>`+GR('#2b2a5a')+`<div class="row">${W(ch({c:'bob'}),B,`<div class="tb">${H()}</div>`)}<div class="gap"><i class="dash" style="border-color:rgba(255,255,255,.4)"></i></div>${W(ch({girl:1,c:'bob d2'}),G,`<div class="tb" style="animation-delay:.6s">${H()}</div>`)}</div>`},
{bg:'linear-gradient(#ffd27a,#ff9fb8)',t:'Years Later… Finally',p:`After years of waiting, the day came. They ran towards each other and the distance simply disappeared.`,
 h:()=>`<div class="sun"></div>`+CL(14,30,100)+GR('#86c47e')+burst(2.6)+`<div class="row">${W(ch({c:'bob wl'}),B)}${W(ch({girl:1,c:'bob wr'}),G)}</div>`,r:'h'},
{bg:'linear-gradient(#fff1d6,#ffd9c2)',t:'Two Families, One Smile',p:`Their families met, shared sweets and stories, and found that they were already one big family.`,
 h:()=>CL(8,28,100)+GR('#a8d8a0')+`<div class="row"><div class="row wl" style="width:auto;gap:2px">${ch({c:'sm bob',tp:'#7a5cff'})}${ch({girl:1,c:'sm bob d2',tp:'#ff9a3c'})}${ch({c:'kid bob',tp:'#ffd23c'})}</div><svg class="gift pop" style="--d:2.6s" viewBox="0 0 60 60"><rect x="6" y="24" width="48" height="32" rx="4" fill="#ff6fa0"/><rect x="26" y="24" width="8" height="32" fill="#ffd23c"/><rect x="4" y="16" width="52" height="12" rx="4" fill="#ff4d88"/><path d="M30 16Q18 0 14 10T30 16Q42 0 46 10T30 16" fill="#ffd23c"/></svg><div class="row wr" style="width:auto;gap:2px">${ch({girl:1,c:'kid bob',tp:'#6fd0ff'})}${ch({girl:1,c:'sm bob d2',tp:'#c4488f'})}${ch({c:'sm bob',tp:'#2fa58b'})}</div></div>`},
{bg:'linear-gradient(#ffe0ec,#fff6c9)',t:'Just Married',p:`${B} and ${G} said "I do". The day was full of flowers, blessings and happy tears.`,
